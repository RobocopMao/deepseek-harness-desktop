<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Harness</title>
  <style>
    :root {
      --bg: #0f1117;
      --text: #e6e9f0;
      --muted: #8b93a7;
      --err: #ff6b6b;
      --accent: #4f8cff;
      --panel: #161a23;
      --border: #2a3040;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 176px;
      height: 176px;
      box-shadow: 0 10px 44px rgba(0, 0, 0, 0.5);
    }
    h1 { font-size: 17px; margin: 0; }
    p { color: var(--muted); margin: 0; font-size: 13px; max-width: 720px; }
    pre {
      max-width: 760px;
      width: 100%;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--err);
      background: rgba(255, 107, 107, 0.08);
      border: 1px solid var(--err);
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
    }
    .repo-form {
      max-width: 760px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }
    .repo-form label {
      color: var(--muted);
      font-size: 12px;
    }
    .repo-form .row {
      display: flex;
      gap: 8px;
    }
    .repo-form input {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 13px;
    }
    .repo-form input:focus { outline: none; border-color: var(--accent); }
    .repo-form button {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #fff;
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }
    .repo-form button:hover { filter: brightness(1.1); }
    .repo-form .status { color: var(--muted); font-size: 12px; min-height: 18px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <img id="icon" class="icon" src="icon.png" alt="" draggable="false" />
    <div id="error-block" class="hidden">
      <h1>Could not start DeepSeek Harness</h1>
      <p>Start the harness yourself (pnpm dsh web), or fix the launch configuration, then restart the client.</p>
      <pre id="error"></pre>
      <div class="repo-form">
        <label for="repo-path">Harness checkout path (saved for next launches)</label>
        <div class="row">
          <input id="repo-path" type="text" placeholder="e.g. E:\deepseek-harness" />
          <button id="save-repo" type="button">Save &amp; retry</button>
        </div>
        <div id="repo-status" class="status"></div>
      </div>
    </div>
  </div>
  <script>
    const { event } = window.__TAURI__;
    event.listen('dsh-boot-error', (e) => {
      document.getElementById('icon').classList.add('hidden');
      document.getElementById('error').textContent = String(e.payload);
      document.getElementById('error-block').classList.remove('hidden');
    });
    document.getElementById('save-repo').addEventListener('click', async () => {
      const path = document.getElementById('repo-path').value.trim();
      const status = document.getElementById('repo-status');
      if (!path) {
        status.textContent = 'Enter the checkout path first.';
        return;
      }
      status.textContent = 'Saving…';
      try {
        await window.__TAURI__.core.invoke('set_repo_dir', { path });
        // The page reloads and the boot sequence restarts.
      } catch (error) {
        status.textContent = String(error);
      }
    });
    // Tell the Rust side the listeners are registered before it boots.
    event.emit('loading-ready');
  </script>
</body>
</html>
